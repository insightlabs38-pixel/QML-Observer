[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qml-observer"
description = "Observability and diagnostic framework for variational quantum machine learning training."
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "QML Observer Contributors" },
]
keywords = [
    "quantum machine learning",
    "barren plateau",
    "observability",
    "pennylane",
    "qiskit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dynamic = ["version"]

dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
pennylane = ["pennylane>=0.35"]
qiskit = ["qiskit>=1.0", "qiskit-machine-learning>=0.7"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "httpx>=0.27",
]

[project.scripts]
qml-observer = "qml_observer.cli.main:main"

[project.urls]
Homepage = "https://github.com/insightlabs38-pixel/QML-Observer"
Repository = "https://github.com/insightlabs38-pixel/QML-Observer"
Issues = "https://github.com/insightlabs38-pixel/QML-Observer/issues"
Documentation = "https://github.com/insightlabs38-pixel/QML-Observer/tree/main/docs"

[tool.hatch.version]
path = "src/qml_observer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qml_observer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["qml_observer"]
ignore_missing_imports = true
